#####################################################################
# Laser Control for Laser-Assisted FDM
# laser_pwm1 (PA3) = Laser 1 (X+ side, preheats when moving X+)
# laser_pwm2 (PC1) = Laser 2 (X- side, preheats when moving X-)
#####################################################################

[gcode_macro LASER_ON]
description: Turn on laser with specified power (0.0-1.0). Use LASER=1 for X+ or LASER=2 for X-.
gcode:
    {% set power = params.POWER|default(0.0)|float %}
    {% set laser = params.LASER|default(1)|int %}
    {% if power < 0 %}
        {% set power = 0 %}
    {% endif %}
    {% if power > 1.0 %}
        {% set power = 1.0 %}
    {% endif %}
    {% if laser == 1 %}
        SET_PIN PIN=laser_pwm1 VALUE={power}
        RESPOND MSG="Laser 1 (X+) ON at {(power*100)|round(1)}%"
    {% elif laser == 2 %}
        SET_PIN PIN=laser_pwm2 VALUE={power}
        RESPOND MSG="Laser 2 (X-) ON at {(power*100)|round(1)}%"
    {% elif laser == 3 %}
        SET_PIN PIN=laser_pwm3 VALUE={power}
        RESPOND MSG="Laser 3 ON at {(power*100)|round(1)}%"
    {% else %}
        RESPOND MSG="ERROR: Invalid laser number. Use LASER=1, LASER=2, or LASER=3"
    {% endif %}

[gcode_macro LASER_OFF]
description: Turn off one or all lasers. Use LASER=1, LASER=2, LASER=3, or omit for all.
gcode:
    {% set laser = params.LASER|default(0)|int %}
    {% if laser == 0 or laser == 1 %}
        SET_PIN PIN=laser_pwm1 VALUE=0
    {% endif %}
    {% if laser == 0 or laser == 2 %}
        SET_PIN PIN=laser_pwm2 VALUE=0
    {% endif %}
    {% if laser == 0 or laser == 3 %}
        SET_PIN PIN=laser_pwm3 VALUE=0
    {% endif %}

[gcode_macro LASER_SET]
description: Set laser power based on movement direction.
  Usage: LASER_SET POWER=0.1 TRAILING_POWER=0.05 DIR=PLUS  (for X+ movement, activates laser 1 at 10%, laser 2 at 5%)
gcode:
    {% set power = params.POWER|default(0.0)|float %}
    {% set trailing_power = params.TRAILING_POWER|default(0.0)|float %}
    {% set dir = params.DIR|default("PLUS")|string|upper %}
    LASER_OFF
    {% if dir == "PLUS" %}
        LASER_ON LASER=1 POWER={power}
        {% if trailing_power > 0 %}
            LASER_ON LASER=2 POWER={trailing_power}
        {% endif %}
    {% elif dir == "MINUS" %}
        LASER_ON LASER=2 POWER={power}
        {% if trailing_power > 0 %}
            LASER_ON LASER=1 POWER={trailing_power}
        {% endif %}
    {% elif dir == "BOTH" %}
        LASER_ON LASER=1 POWER={power}
        LASER_ON LASER=2 POWER={power}
    {% endif %}

[gcode_macro LASER_EMERGENCY_OFF]
description: Emergency shutoff for all lasers
gcode:
    SET_PIN PIN=laser_pwm1 VALUE=0
    SET_PIN PIN=laser_pwm2 VALUE=0
    SET_PIN PIN=laser_pwm3 VALUE=0
    SET_PIN PIN=laser_pwm VALUE=0
    RESPOND MSG="!!! ALL LASERS OFF !!!"

[gcode_macro LASER_TEST]
description: Test fire a laser at low power for 1 second to verify operation and check focus.
  Usage: LASER_TEST [LASER=1] [POWER=0.01]
gcode:
    {% set laser = params.LASER|default(1)|int %}
    {% set power = params.POWER|default(0.05)|float %}
    RESPOND MSG="Test firing Laser {laser} at {(power*100)|round(1)}% for 1 second"
    LASER_ON LASER={laser} POWER={power}
    G4 P1000
    LASER_OFF LASER={laser}


